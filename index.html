<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>Personal Expense Tracker</h1>
      <p>Manage Your Finances Smartly</p>
    </header>

    <main class="dashboard-grid">
      <section class="summary-container">
        <div class="card balance-card">
          <h2>Total Balance</h2>
          <p id="total-balance">₹0.00</p>
        </div>
        <div class="card income-card">
          <h2>Total Income</h2>
          <p id="total-income">₹0.00</p>
        </div>
        <div class="card expense-card">
          <h2>Total Expenses</h2>
          <p id="total-expense">₹0.00</p>
        </div>
      </section>

      <section class="card form-section">
        <h2>Add Transaction</h2>
        <form id="transaction-form">
          <div class="form-group">
            <label for="description">Description</label>
            <input type="text" id="description" placeholder="Salary, Rent, Groceries..." required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="amount">Amount (₹)</label>
              <input type="number" id="amount" step="0.01" placeholder="0.00" required>
            </div>

            <div class="form-group">
              <label for="type">Type</label>
              <select id="type" required>
                <option value="income">Income</option>
                <option value="expense">Expense</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" required>
              <option value="" disabled selected>Select Category</option>
              <option value="Salary">Salary</option>
              <option value="Freelance">Freelance</option>
              <option value="Food">Food</option>
              <option value="Rent">Rent</option>
              <option value="Utilities">Utilities</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Shopping">Shopping</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <button type="submit" class="btn-submit">Add Transaction</button>
        </form>
      </section>

      <section class="card history-section">
        <div class="history-header">
          <h2>Transaction History</h2>
          <div class="controls">
            <input type="text" id="search-input" placeholder="Search transactions...">
            <select id="filter-category">
              <option value="All">All Categories</option>
              <option value="Salary">Salary</option>
              <option value="Freelance">Freelance</option>
              <option value="Food">Food</option>
              <option value="Rent">Rent</option>
              <option value="Utilities">Utilities</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Shopping">Shopping</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <ul id="transaction-list" class="transaction-list"></ul>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
